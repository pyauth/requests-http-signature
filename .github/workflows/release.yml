name: Publish release to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and upload release to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/p/requests-http-signature
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install package
        run: python -m pip install --upgrade pip '.[tests]'
      - name: Test
        run: make test
      - name: Build distributions
        run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
